<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Aryal | Official Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .tagline {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .bio {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #38bdf8;
            text-align: left;
        }
        .btn {
            display: block;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Aman Aryal">
        
        <h1>Aman Aryal</h1>
        <div class="tagline">Tech Enthusiast & Creator</div>
        
        <div class="bio">
            नमस्ते! म अमन अर्याल। प्रविधि, एन्ड्रोइड एप डेभलपमेन्ट र नयाँ डिजिटल सिर्जनाहरूमा मेरो निकै रुचि छ। यो मेरो आफ्नै सर्भरमा होस्ट गरिएको आधिकारिक प्रोफाइल एप हो।
        </div>
        
        <a href="mailto:contact@amanaryal.com" class="btn">Contact Me</a>
    </div>

</body>
</html>
